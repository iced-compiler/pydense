name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: mypy

      - name: Pytest
        run: pytest

  fidelity:
    name: corpus fidelity (stdlib, 100% required)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        mode: [full, nodoc, stripped]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]"

      - name: Round-trip the stdlib corpus (${{ matrix.mode }})
        run: |
          python benchmarks/corpus_fidelity.py --mode ${{ matrix.mode }} \
            --json fidelity-${{ matrix.mode }}-py${{ matrix.python-version }}.json \
            --fail-under 100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-${{ matrix.mode }}-py${{ matrix.python-version }}
          path: fidelity-*.json
